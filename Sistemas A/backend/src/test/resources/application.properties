spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
# Banco privado por contexto Spring: usar cache=shared fazia varios contextos
# de teste (cada um com seu proprio ddl-auto=create-drop) colidirem no MESMO
# banco em memoria, entao quando um contexto era encerrado (create-drop) ele
# apagava as tabelas que outro contexto ainda estava usando, corrompendo as
# leituras. Uma unica conexao (pool de tamanho 1) com banco privado evita
# tanto isso quanto a inconsistencia entre conexoes do mesmo pool.
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Roda o schema.sql (cria a tabela "jogos" manualmente, ver comentario no
# arquivo) antes do Hibernate. Trocamos create-drop por update porque cada
# contexto de teste já recebe um banco em memoria vazio (ver url acima), e
# "update" respeita a tabela que o schema.sql ja criou em vez de tentar
# recria-la.
spring.sql.init.mode=always

google.client-id=test-client-id
app.cors.allowed-origin=http://localhost:5173
app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173
