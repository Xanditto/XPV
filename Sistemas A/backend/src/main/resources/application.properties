spring.application.name=backend
server.port=8080

# Banco de dados SQLite (arquivo criado automaticamente em backend/data/xpv.db)
spring.datasource.url=jdbc:sqlite:./data/xpv.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ID do OAuth Client do Google (não é secreto - é o mesmo usado no frontend).
# Pode ser sobrescrito pela variável de ambiente GOOGLE_CLIENT_ID se necessário.
google.client-id=${GOOGLE_CLIENT_ID:50898832420-up30ovtc4kodqfn9a0v1q1lng2ra7bfs.apps.googleusercontent.com}

# Origem permitida para chamadas do frontend (Vite dev server)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Por padrão o Spring esconde o campo "message" das respostas de erro (por
# segurança, contra vazar detalhes internos). Aqui habilitamos porque as
# mensagens que a aplicação gera são sempre pensadas para o usuário final
# (ex.: "E-mail/nickname ou senha inválidos"), nunca stack traces.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

# URLs usadas para montar os links de retorno dos logins Steam/Battle.net
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Steam Web API (gratuita, gerada em steamcommunity.com/dev/apikey). Não tem
# "secret" separado - a própria key já funciona como identificação do app.
steam.api-key=${STEAM_API_KEY:}

# Riot Games API (developer.riotgames.com). A chave "pessoal" gratuita
# expira a cada 24h e precisa ser gerada de novo manualmente no painel.
riot.api-key=${RIOT_API_KEY:}
riot.routing=${RIOT_ROUTING:americas}

# Battle.net OAuth (criado em develop.battle.net). Region deve bater com a
# conta do usuário (us cobre Americas, incluindo Brasil).
battlenet.client-id=${BATTLENET_CLIENT_ID:}
battlenet.client-secret=${BATTLENET_CLIENT_SECRET:}
battlenet.region=${BATTLENET_REGION:us}
