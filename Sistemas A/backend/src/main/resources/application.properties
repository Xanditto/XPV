spring.application.name=backend
server.port=8080

# Banco de dados SQLite (arquivo criado automaticamente em backend/data/xpv.db)
spring.datasource.url=jdbc:sqlite:./data/xpv.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ID do OAuth Client do Google (ver README para instruções de como gerar)
google.client-id=${GOOGLE_CLIENT_ID:}

# Origem permitida para chamadas do frontend (Vite dev server)
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
